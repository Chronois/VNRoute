<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNRoute</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="vn-container">
        <header>
            <h1>VNRoute</h1>
            <p class="subtitle">Visual Novel Route Tracker</p>
        </header>

        <main>
            <!-- Kontainer Pilihan Dinamis -->
            <section id="choices-container" class="choices-container">
                <!-- Pilihan akan di-render oleh JavaScript di sini -->
            </section>

            <button class="btn-add-main" onclick="addChoiceGroup()">+ Tambah Choice Group Baru</button>

            <!-- Section Hasil / Result -->
            <section class="result-container">
                <div class="result-header">
                    <span class="result-title">Result Log</span>
                    <div class="route-controls">
                        <button onclick="saveRouteLine()" class="btn-control">Simpan Baris</button>
                        <button onclick="clearCurrentRoute()" class="btn-control btn-danger">Hapus Aktif</button>
                    </div>
                </div>
                
                <div class="dialogue-box">
                    <div class="dialogue-text" id="route-log">
                        <!-- History rute yang sudah disimpan akan muncul di sini -->
                    </div>
                    <!-- Rute yang sedang berjalan -->
                    <div class="dialogue-text active-route" id="current-route-text"></div>
                    <div class="vn-cursor">▼</div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
