<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN Route Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="vn-container">
        <header>
            <h1>Route Log System</h1>
        </header>

        <main>
            <!-- Section Pilihan -->
            <section class="choices-container">
                <!-- Choice 1 -->
                <div class="choice-group">
                    <div class="choice-title">Choice 1</div>
                    <button class="choice-option">1 Ask her for dinner</button>
                    <button class="choice-option">2 Go straight to home</button>
                </div>

                <!-- Choice 2 -->
                <div class="choice-group">
                    <div class="choice-title">Choice 2</div>
                    <button class="choice-option">1 Stand for her</button>
                    <button class="choice-option">2 Call the Police</button>
                    <button class="choice-option">3 Search other route</button>
                </div>
            </section>

            <!-- Section Hasil / Result -->
            <section class="result-container">
                <div class="result-title">Result</div>
                <div class="dialogue-box">
                    <div class="dialogue-text">
                        <p>1 -> Dinner Scene -> 2 -> Bruised Scene</p>
                        <p>2 -> 2 -> Escape Scene</p>
                    </div>
                    <div class="vn-cursor">▼</div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
